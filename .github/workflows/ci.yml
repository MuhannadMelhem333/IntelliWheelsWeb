name: CI

on:
  push:
    branches: [production, stg, dev]
  pull_request:
    branches: [production, stg]

jobs:
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Frontend regression tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://intelliwheels-backend.onrender.com' }}

  backend:
    name: Backend — Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-test.txt

      - name: Check syntax (py_compile)
        run: python -m py_compile backend/run.py backend/app/__init__.py backend/app/db.py

      - name: Install video validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Isolated backend regression tests
        env:
          REQUIRE_VIDEO_TOOLS: '1'
        working-directory: backend
        # Explicit modules avoid discovering/importing app and initializing a database
        # before the journey fixture establishes its isolated environment.
        run: python -m unittest test_public_journey test_rate_limits test_import_local_cars test_inspect_uploads test_inspect_upload_provider test_video_validation test_release_config -v
